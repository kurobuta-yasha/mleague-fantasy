name: Update standings

on:
  schedule:
    # JST 00:30 / 03:00 / 07:00 に毎日実行（UTC表記）。
    # 試合は月火木金だが、変更がなければコミットしないので毎日回しても無害。
    # 振替開催や公式サイトの反映遅れもこれで拾える。
    - cron: "30 15 * * *"
    - cron: "0 18 * * *"
    - cron: "0 22 * * *"
  push:
    branches: [main]
    paths: ["site/**", "data/picks.json", "data/teams.json", "scripts/**", ".github/workflows/**"]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: update-standings
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fetch standings from m-league.jp
        run: python scripts/fetch_standings.py

      - name: Commit if changed
        run: |
          if git diff --quiet -- data/; then
            echo "no changes"
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
            git add data/
            git commit -m "Update standings $(TZ=Asia/Tokyo date '+%Y-%m-%d %H:%M JST')"
            git push
          fi

      - name: Build site
        run: ./scripts/build_site.sh

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: update
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
