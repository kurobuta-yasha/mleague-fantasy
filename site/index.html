<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Mリーグ 3チーム勝負</title>
<meta name="theme-color" content="#0f1115" media="(prefers-color-scheme: dark)">
<meta name="theme-color" content="#f6f5f1" media="(prefers-color-scheme: light)">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🀄</text></svg>">
<style>
  :root {
    --bg: #f6f5f1;
    --card: #ffffff;
    --ink: #1c1d21;
    --muted: #6b6f78;
    --line: #e4e2dc;
    --plus: #0a7d4f;
    --minus: #c2362f;
    --accent: #b8860b;
    --chip: #f1efe9;
    --gold: #d4a017;
    --silver: #9aa3ad;
    --bronze: #b0703c;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0f1115;
      --card: #181b21;
      --ink: #eceef2;
      --muted: #9097a3;
      --line: #2a2e36;
      --plus: #3ecf8e;
      --minus: #ff6b62;
      --accent: #e6b84a;
      --chip: #22262e;
    }
  }
  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Noto Sans JP", sans-serif;
    font-size: 15px;
    line-height: 1.45;
    padding: env(safe-area-inset-top) 0 env(safe-area-inset-bottom);
  }
  .wrap { max-width: 560px; margin: 0 auto; padding: 16px 16px 40px; }
  header h1 { font-size: 20px; margin: 4px 0 2px; letter-spacing: .02em; }
  .meta { color: var(--muted); font-size: 12.5px; display: flex; flex-wrap: wrap; gap: 4px 12px; }
  .progress { height: 4px; background: var(--line); border-radius: 2px; margin: 10px 0 14px; overflow: hidden; }
  .progress > i { display: block; height: 100%; background: var(--accent); }

  .tabs { display: flex; gap: 4px; background: var(--chip); padding: 4px; border-radius: 10px; margin-bottom: 14px; position: sticky; top: 8px; z-index: 2; }
  .tabs button {
    flex: 1; border: 0; background: transparent; color: var(--muted);
    padding: 8px 0; border-radius: 7px; font: inherit; font-weight: 600; cursor: pointer;
  }
  .tabs button[aria-selected="true"] { background: var(--card); color: var(--ink); box-shadow: 0 1px 2px rgba(0,0,0,.12); }

  ol.list { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; }
  .row { display: flex; align-items: center; gap: 12px; }
  .rank {
    flex: none; width: 34px; height: 34px; border-radius: 50%;
    display: grid; place-items: center; font-weight: 800; font-size: 15px;
    background: var(--chip); color: var(--ink); font-variant-numeric: tabular-nums;
  }
  .rank.r1 { background: var(--gold); color: #fff; }
  .rank.r2 { background: var(--silver); color: #fff; }
  .rank.r3 { background: var(--bronze); color: #fff; }
  .who { flex: 1; min-width: 0; }
  .name { font-weight: 700; font-size: 16px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .sub { color: var(--muted); font-size: 12px; }
  .total { text-align: right; font-weight: 800; font-size: 18px; font-variant-numeric: tabular-nums; white-space: nowrap; }
  .total small { font-size: 11px; font-weight: 600; margin-left: 1px; }
  .move { font-size: 11.5px; font-weight: 700; text-align: right; }
  .up { color: var(--plus); } .down { color: var(--minus); } .flat { color: var(--muted); }
  .plus { color: var(--plus); } .minus { color: var(--minus); }
  .chips { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; margin-top: 10px; }
  .chip {
    background: var(--chip); border-radius: 8px; padding: 5px 6px; text-align: center;
    font-size: 11.5px; line-height: 1.3; font-variant-numeric: tabular-nums; min-width: 0;
  }
  .chip span { display: block; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .chip b { display: block; font-weight: 700; font-size: 13px; }

  table { width: 100%; border-collapse: collapse; background: var(--card); border: 1px solid var(--line); border-radius: 12px; overflow: hidden; }
  th, td { padding: 10px 10px; text-align: left; border-bottom: 1px solid var(--line); font-variant-numeric: tabular-nums; }
  tr:last-child td { border-bottom: 0; }
  th { font-size: 11.5px; color: var(--muted); font-weight: 600; background: var(--chip); }
  td.num, th.num { text-align: right; white-space: nowrap; }
  td.pt { font-weight: 700; }
  .picked { color: var(--muted); font-size: 12px; }

  .note { color: var(--muted); font-size: 12px; margin-top: 18px; }
  .note a { color: inherit; }
  .error { background: var(--card); border: 1px solid var(--minus); color: var(--minus); padding: 12px; border-radius: 10px; }
  [hidden] { display: none !important; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1 id="title">Mリーグ 3チーム勝負</h1>
    <div class="meta">
      <span id="updated">読み込み中…</span>
      <span id="games"></span>
    </div>
    <div class="progress"><i id="bar" style="width:0"></i></div>
  </header>

  <nav class="tabs" role="tablist">
    <button role="tab" aria-selected="true" data-tab="players">参加者ランキング</button>
    <button role="tab" aria-selected="false" data-tab="teams">チーム成績</button>
  </nav>

  <section id="players"><ol class="list" id="player-list"></ol></section>
  <section id="teams" hidden>
    <table>
      <thead><tr><th>#</th><th>チーム</th><th class="num">pt</th><th class="num">選んだ人</th></tr></thead>
      <tbody id="team-body"></tbody>
    </table>
  </section>

  <p class="note">
    スコア＝選んだ3チームのレギュラーシーズン累計ポイント合計。<br>
    順位の矢印は前回更新時からの変動。データ元: <a href="https://m-league.jp/" rel="noopener">m-league.jp</a>（試合日の深夜に自動更新）
  </p>
</div>

<script>
(async function () {
  const $ = (id) => document.getElementById(id);
  const bust = "?t=" + Date.now();
  const get = (p) => fetch(p + bust, { cache: "no-store" }).then((r) => {
    if (!r.ok) throw new Error(p + " " + r.status);
    return r.json();
  });

  let picks, teamsMaster, standings, history;
  try {
    [picks, teamsMaster, standings, history] = await Promise.all([
      get("data/picks.json"), get("data/teams.json"), get("data/standings.json"),
      get("data/history.json").catch(() => []),
    ]);
  } catch (e) {
    $("player-list").innerHTML = `<li class="error">データの読み込みに失敗しました（${e.message}）</li>`;
    return;
  }

  const shortName = Object.fromEntries(teamsMaster.teams.map((t) => [t.name, t.short]));
  const points = Object.fromEntries(standings.teams.map((t) => [t.name, t.point]));
  const r1 = (x) => Math.round(x * 10) / 10;
  const fmt = (x) => (x > 0 ? "+" : "") + x.toFixed(1);
  const cls = (x) => (x > 0 ? "plus" : x < 0 ? "minus" : "");
  const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));

  // 同点は同順位（Excel の RANK と同じ 1,1,3 方式）
  function rankBy(items, key) {
    const sorted = [...items].sort((a, b) => key(b) - key(a));
    let prevVal = null, prevRank = 0;
    sorted.forEach((it, i) => {
      const v = key(it);
      it.rank = v === prevVal ? prevRank : i + 1;
      prevVal = v; prevRank = it.rank;
    });
    return sorted;
  }
  const totalOf = (p, pts) => r1(p.teams.reduce((s, t) => s + (pts[t] ?? 0), 0));

  // 前回スナップショット時点の順位
  const prevRank = {};
  if (history.length >= 2) {
    const prevPts = history[history.length - 2].points;
    rankBy(picks.participants.map((p) => ({ name: p.name, total: totalOf(p, prevPts) })), (x) => x.total)
      .forEach((x) => (prevRank[x.name] = x.rank));
  }

  // ヘッダー
  $("title").textContent = picks.title;
  document.title = picks.title;
  const upd = new Date(standings.updated_at);
  $("updated").textContent = "更新 " + upd.toLocaleString("ja-JP", {
    timeZone: "Asia/Tokyo", month: "numeric", day: "numeric", weekday: "short", hour: "2-digit", minute: "2-digit",
  });
  const g = standings.teams[0];
  if (g && g.games != null) {
    const played = Math.max(...standings.teams.map((t) => t.games));
    $("games").textContent = `${picks.season} レギュラー ${played}/${g.games_total}試合`;
    $("bar").style.width = (played / g.games_total * 100).toFixed(1) + "%";
  }

  // 参加者ランキング
  const players = rankBy(picks.participants.map((p) => ({ ...p, total: totalOf(p, points) })), (x) => x.total);
  const leader = players[0]?.total ?? 0;
  $("player-list").innerHTML = players.map((p) => {
    let move = "";
    if (prevRank[p.name] != null) {
      const d = prevRank[p.name] - p.rank;
      move = d > 0 ? `<div class="move up">▲${d}</div>` : d < 0 ? `<div class="move down">▼${-d}</div>` : `<div class="move flat">―</div>`;
    }
    const gap = p.rank === 1 ? "首位" : `首位まで ${(leader - p.total).toFixed(1)}pt`;
    const chips = [...p.teams]
      .sort((a, b) => (points[b] ?? 0) - (points[a] ?? 0))
      .map((t) => `<div class="chip"><span>${esc(shortName[t] ?? t)}</span><b class="${cls(points[t] ?? 0)}">${fmt(points[t] ?? 0)}</b></div>`)
      .join("");
    return `<li class="card">
      <div class="row">
        <div class="rank r${p.rank}">${p.rank}</div>
        <div class="who"><div class="name">${esc(p.name)}</div><div class="sub">${gap}</div></div>
        <div><div class="total ${cls(p.total)}">${fmt(p.total)}<small>pt</small></div>${move}</div>
      </div>
      <div class="chips">${chips}</div>
    </li>`;
  }).join("");

  // チーム成績
  const pickCount = {};
  picks.participants.forEach((p) => p.teams.forEach((t) => (pickCount[t] = (pickCount[t] || 0) + 1)));
  const teams = rankBy(standings.teams.map((t) => ({ ...t })), (x) => x.point);
  $("team-body").innerHTML = teams.map((t) => `<tr>
      <td>${t.rank}</td>
      <td>${esc(t.name)}</td>
      <td class="num pt ${cls(t.point)}">${fmt(t.point)}</td>
      <td class="num picked">${pickCount[t.name] || 0}人</td>
    </tr>`).join("");

  // タブ
  document.querySelectorAll(".tabs button").forEach((btn) => btn.addEventListener("click", () => {
    document.querySelectorAll(".tabs button").forEach((b) => b.setAttribute("aria-selected", b === btn));
    $("players").hidden = btn.dataset.tab !== "players";
    $("teams").hidden = btn.dataset.tab !== "teams";
  }));
})();
</script>
</body>
</html>
